<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App do Técnico - Campo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #login-screen{position:absolute;inset:0;background:#f5f7fa;z-index:2000;display:flex;align-items:center;justify-content:center}
  .login-card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);width:100%;max-width:340px;box-sizing:border-box}
  input,button{width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:15px}
  button{background:#1a9b4b;color:#fff;border:0;font-weight:700;cursor:pointer}
  
  #panel{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#fff;
    border-radius:14px 14px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.3);padding:12px;max-width:560px;margin:0 auto}
  .row{display:flex;gap:6px;align-items:center}
  
  .pin-red{background:#dc2626;color:#fff;border:2px solid #fff;border-radius:50%;width:32px;height:32px;line-height:28px;text-align:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .pin-blue{background:#2563eb;color:#fff;border:2px solid #fff;border-radius:50%;width:32px;height:32px;line-height:28px;text-align:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .pin-me{background:#2563eb;color:#fff;border:2px solid #fff;border-radius:50%;width:20px;height:20px;line-height:16px;text-align:center;font-size:10px;box-shadow:0 0 8px #2563eb}
  
  .pop{text-align:center}
  .pop .cod{font-size:22px;font-weight:700;margin:4px 0 8px}
  .pop button{background:#1a9b4b;width:100%;padding:10px}
  .pop button.blue{background:#2563eb;margin-top:6px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h3 style="margin-top:0;color:#1a9b4b;text-align:center">Login Técnico</h3>
    <input type="email" id="email" placeholder="Seu e-mail cadastrado">
    <input type="password" id="password" placeholder="Sua senha">
    <button id="btnLogin">Entrar</button>
    <p id="login-msg" style="color:#d33;font-size:13px;text-align:center;margin:0;"></p>
  </div>
</div>

<div id="map"></div>

<div id="panel">
  <!-- Caixa de Busca de Poste -->
  <div style="background:#f8fafc;padding:8px;border-radius:8px;margin-bottom:8px;border:1px solid #e2e8f0;">
    <label style="font-size:12px;font-weight:bold;color:#475569;display:block;margin-bottom:4px;">🔍 Buscar Poste na Fila:</label>
    <div class="row" style="margin-bottom:0">
      <input type="text" id="txtBusca" placeholder="Ex: 1456 ou Poste 1441" style="margin-bottom:0">
      <button id="btnBuscar" style="width:auto;padding:10px 16px;margin-bottom:0">Buscar</button>
    </div>
  </div>

  <div class="row">
    <button class="sec" id="me" style="background:#e5e7eb;color:#111">📍 Minha Posição</button>
    <button class="sec" id="fit" style="background:#e5e7eb;color:#111">Ver Todos</button>
    <button class="sec" id="btnLogout" style="background:#fee2e2;color:#991b1b;width:auto">Sair</button>
    <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
  </div>
  <p id="msg" style="font-size:13px;color:#555;margin:6px 0 0;text-align:center">Sincronizado</p>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const fdb = firebase.database(), au = firebase.auth();
const $ = id => document.getElementById(id);

let markers = {}, currentPt = null, lastPos = null, meMarker = null;
let pontosCache = {}; // Armazena os pontos carregados do banco
let selecionadosIds = new Set(); // IDs dos postes selecionados (azuis)

const map = L.map('map', { zoomControl: false }).setView([-14.2, -51.9], 4);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

map.locate({ watch: true, enableHighAccuracy: true });
map.on('locationfound', e => {
  lastPos = e.latlng;
  if (!meMarker) {
    const icon = L.divIcon({ className: '', html: `<div class="pin-me"></div>`, iconSize: [20,20], iconAnchor: [10,10] });
    meMarker = L.marker(e.latlng, { icon }).addTo(map).bindPopup("Você está aqui");
  } else {
    meMarker.setLatLng(e.latlng);
  }
});

$('btnLogin').onclick = () => {
  au.signInWithEmailAndPassword($('email').value.trim(), $('password').value)
    .catch(err => { $('login-msg').textContent = 'Erro: ' + err.message; });
};

$('btnLogout').onclick = () => au.signOut().then(() => location.reload());

au.onAuthStateChanged(user => {
  if (user) {
    $('login-screen').style.display = 'none';
    carregarPontosTecnico(user.email);
  } else {
    $('login-screen').style.display = 'flex';
    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};
  }
});

function carregarPontosTecnico(email) {
  const tecKey = email.replace(/\./g, ',');
  
  fdb.ref('adm/fila/' + tecKey).on('value', snapshot => {
    pontosCache = snapshot.val() || {};
    desenharMapaPontos();
  });
}

function desenharMapaPontos() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  let coords = [];
  Object.values(pontosCache).forEach(p => {
    const isSelecionado = selecionadosIds.has(p.id);
    let pinClass = isSelecionado ? 'pin-blue' : 'pin-red';

    const icon = L.divIcon({ className: '', html: `<div class="${pinClass}">${p.n || '📍'}</div>`, iconSize: [32,32], iconAnchor: [16,16] });
    const m = L.marker([p.lat, p.lng], { icon }).addTo(map);
    
    const box = document.createElement('div');
    box.className = 'pop';
    box.innerHTML = `<div>Poste</div><div class="cod">${p.code}</div>`;
    
    // Botão de Executar / Tirar Foto
    const btnFoto = document.createElement('button');
    btnFoto.textContent = '📷 Tirar Foto & Executar';
    btnFoto.onclick = () => { currentPt = p; $('cam').click(); };
    box.appendChild(btnFoto);

    // Botão para Adicionar / Remover da Lista de Selecionados
    const btnLista = document.createElement('button');
    btnLista.className = 'blue';
    btnLista.textContent = isSelecionado ? '❌ Remover da Lista' : '➕ Adicionar à Lista';
    btnLista.onclick = () => {
      if (isSelecionado) {
        selecionadosIds.delete(p.id);
      } else {
        selecionadosIds.add(p.id);
        // Pergunta se deseja continuar adicionando outro poste
        const continuar = confirm(`Poste ${p.code} adicionado à lista!\nDeseja adicionar outro poste?`);
        if (continuar) {
          $('txtBusca').value = '';
          $('txtBusca').focus();
          map.closePopup();
          desenharMapaPontos();
          return;
        }
      }
      desenharMapaPontos();
      map.closePopup();
    };
    box.appendChild(btnLista);
    
    m.bindPopup(box);
    markers[p.id] = m;
    coords.push([p.lat, p.lng]);
  });

  if(coords.length > 0 && !window.jaFocouInicial) {
    map.fitBounds(coords, { padding: [50, 50], maxZoom: 16 });
    window.jaFocouInicial = true;
  }
}

// Lógica do botão Buscar
$('btnBuscar').onclick = () => {
  const termo = $('txtBusca').value.trim().toLowerCase();
  if (!termo) {
    alert('Digite o código ou número do poste para buscar.');
    return;
  }

  // Procura entre os postes não executados (cache)
  let encontrado = null;
  for (const [id, p] of Object.entries(pontosCache)) {
    const codeStr = String(p.code || '').toLowerCase();
    const numStr = String(p.n || '').toLowerCase();
    if (codeStr.includes(termo) || numStr.includes(termo)) {
      encontrado = p;
      break;
    }
  }

  if (encontrado && markers[encontrado.id]) {
    map.setView([encontrado.lat, encontrado.lng], 18);
    markers[encontrado.id].openPopup();
    $('msg').textContent = `Poste ${encontrado.code} encontrado!`;
  } else {
    alert('Poste não encontrado na sua fila de pendentes.');
  }
};

async function obterNomeRua(lat, lng) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    const data = await res.json();
    if (data && data.address) {
      return data.address.road || data.address.pedestrian || data.address.suburb || 'Endereço não localizado';
    }
  } catch(e) {}
  return 'GPS Ativo';
}

function carimbarImagem(file, dados) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(img, 0, 0);

        const fontSize = Math.max(20, Math.floor(canvas.width * 0.035));
        ctx.font = `bold ${fontSize}px sans-serif`;
        const padding = 15;
        const lineHeight = fontSize + 8;
        
        const linhas = [
          `POSTE: ${dados.code}`,
          `RUA: ${dados.rua}`,
          `GPS: ${dados.lat}, ${dados.lng}`,
          `DATA: ${dados.dataHora}`
        ];

        const boxHeight = (linhas.length * lineHeight) + (padding * 2);
        const boxWidth = canvas.width;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, boxWidth, boxHeight);

        ctx.fillStyle = '#ffffff';
        let y = padding + fontSize;
        linhas.forEach(texto => {
          ctx.fillText(texto, padding, y);
          y += lineHeight;
        });

        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

$('cam').onchange = async (e) => {
  const file = e.target.files[0];
  const p = currentPt;
  $('cam').value = '';
  if (!file || !p) return;

  $('msg').textContent = 'Obtendo GPS e endereço...';
  
  let lat = lastPos ? lastPos.lat : p.lat;
  let lng = lastPos ? lastPos.lng : p.lng;
  let ruaNome = await obterNomeRua(lat, lng);
  let agora = new Date().toLocaleString('pt-BR');

  $('msg').textContent = 'Carimbando dados na foto...';

  const dadosCarimbo = {
    code: p.code,
    rua: ruaNome,
    lat: lat.toFixed(6),
    lng: lng.toFixed(6),
    dataHora: agora
  };

  const fotoBase64Carimbada = await carimbarImagem(file, dadosCarimbo);
  const fotoId = 'foto_' + Date.now();
  const user = au.currentUser;
  const tecKey = user.email.replace(/\./g, ',');

  try {
    const updates = {};
    updates['adm/fotos_meta/' + fotoId] = {
      pid: p.id,
      code: p.code,
      tec: user.email,
      rua: ruaNome,
      time: new Date().toISOString(),
      gps: { lat, lng }
    };
    updates['adm/fotos_data/' + fotoId + '/img'] = fotoBase64Carimbada;
    
    // Remove o ponto da fila do técnico e da lista de selecionados
    updates['adm/fila/' + tecKey + '/' + p.id] = null;
    selecionadosIds.delete(p.id);

    await fdb.ref().update(updates);
    $('msg').textContent = 'Enviado com sucesso!';
    map.closePopup();
  } catch(err) {
    $('msg').textContent = 'Erro ao enviar foto.';
  }
};

$('fit').onclick = () => {
  const values = Object.values(markers);
  if(values.length > 0) map.fitBounds(new L.featureGroup(values).getBounds(), { padding: [50, 50], maxZoom: 16 });
};

$('me').onclick = () => {
  if (lastPos) map.setView(lastPos, 17);
  else map.locate({ setView: true, maxZoom: 16 });
};
</script>
</body>
</html>
