<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Rotas e fotos</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f6;color:#111}
  header{background:#1d6fe8;color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  main{max-width:960px;margin:0 auto;padding:12px}
  input,select,button{font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid #bbb}
  button{background:#1d6fe8;color:#fff;border:0}
  button.sec{background:#e5e7eb;color:#111}
  label{font-size:13px;display:flex;flex-direction:column;gap:2px}
  .card{background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .pole{border-left:8px solid #dc2626}
  .pole.green{border-left-color:#16a34a}.pole.gray{border-left-color:#9ca3af;opacity:.75}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#fee2e2;color:#991b1b}
  .tag.green{background:#dcfce7;color:#166534}.tag.gray{background:#e5e7eb;color:#374151}
  .th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .th img{height:150px;min-width:80px;border-radius:6px;background:#ddd}
  h3{margin:16px 0 4px}
  #login{max-width:340px;margin:40px auto}
  #login input{width:100%;box-sizing:border-box;margin-bottom:8px}
  #err{font-size:13px;color:#b00}
  #st,.leg{font-size:13px;color:#555}
</style>
</head>
<body>
<header><span>🗺 Rotas e fotos · Admin</span><button class="sec" id="out" style="display:none">Sair</button></header>
<main>
  <div id="login" class="card">
    <h3>Entrar</h3>
    <input id="em" type="email" placeholder="E-mail do administrador">
    <input id="pw" type="password" placeholder="Senha">
    <button id="go">Entrar</button>
    <p id="err"></p>
  </div>

  <div id="app" style="display:none">
    <details class="card">
      <summary><b>👷 Técnicos</b></summary>
      <div class="row" style="margin-top:8px">
        <input id="tn" placeholder="Nome" style="flex:1;min-width:110px">
        <input id="te" type="email" placeholder="E-mail" style="flex:1;min-width:150px">
        <input id="ts" placeholder="Senha (mín. 6)" style="flex:1;min-width:110px">
        <button id="addt">Cadastrar</button>
      </div>
      <p id="tm" style="font-size:13px"></p>
      <div id="tl"></div>
    </details>

    <details class="card">
      <summary><b>📥 Importar rota (Excel)</b></summary>
      <div class="row" style="margin-top:8px"><input type="file" id="xf"></div>
      <div id="map2" style="display:none">
        <div class="row" style="margin-top:8px">
          <label>Nº do poste <select id="mc"></select></label>
          <label>Latitude <select id="ml"></select></label>
          <label>Longitude <select id="mo"></select></label>
          <label>Info (opcional) <select id="mi"></select></label>
          <label>Atribuir a <select id="mt"></select></label>
          <button id="imp">Importar</button>
        </div>
      </div>
      <p id="xm" style="font-size:13px"></p>
    </details>

    <div class="card row">
      <input id="q" placeholder="Buscar poste, rua, técnico ou rota" style="flex:1;min-width:140px">
      <select id="fe">
        <option value="">Todos</option>
        <option value="red">🔴 Aguardando foto</option>
        <option value="green">🟢 Foto recebida</option>
        <option value="gray">⚪ Concluídos</option>
      </select>
      <button class="sec" id="all">Marcar todos</button>
    </div>
    <div class="card row">
      <span style="font-size:13px">Marcados:</span>
      <select id="bt"></select><button id="bat">Atribuir</button>
      <button id="bco">✔ Concluir</button>
      <button class="sec" id="bex">🗑 Excluir</button>
      <select id="lote">
        <option value="0">Baixar tudo num ZIP</option>
        <option value="2">ZIPs de 2 postes</option>
        <option value="5">ZIPs de 5 postes</option>
        <option value="10">ZIPs de 10 postes</option>
      </select>
      <button id="dl">⬇ Baixar</button>
    </div>
    <p class="leg">🔴 carregado, aguardando foto · 🟢 técnico enviou foto · ⚪ concluído (depois de baixar)</p>
    <p id="st"></p>
    <div id="list"></div>
  </div>
</main>

<script>
firebase.initializeApp(firebaseConfig);
const fdb = firebase.database(), au = firebase.auth();
const $ = id => document.getElementById(id);
const el = (t, x, c) => { const e = document.createElement(t); if (x) e.textContent = x; if (c) e.className = c; return e; };
let po = {}, meta = {}, cc = {}, tecs = {}, byId = {}, vis = [], linhas = [], rotaNome = '';
const sel = new Set(), open = new Set();
const TXT = { red: '🔴 aguardando foto', green: '🟢 foto recebida', gray: '⚪ concluído' };
const say = (m, c) => { $('st').style.color = c || '#555'; $('st').textContent = m; };

$('go').onclick = () => au.signInWithEmailAndPassword($('em').value.trim(), $('pw').value)
  .catch(() => { $('err').textContent = 'E-mail ou senha incorretos'; });
$('out').onclick = () => au.signOut().then(() => location.reload());

au.onAuthStateChanged(u => {
  $('login').style.display = u ? 'none' : '';
  $('app').style.display = u ? '' : 'none';
  $('out').style.display = u ? '' : 'none';
  if (!u) return;
  const erro = () => say('Sem permissão para ler. Confira as regras e o e-mail em config/admin.', '#b00');
  const L = (path, set) => fdb.ref(path).on('value', s => { set(s.val() || {}); draw(); }, erro);
  L('adm/postes', v => po = v); L('adm/fotos_meta', v => meta = v); L('adm/concluidos', v => cc = v);
  fdb.ref('adm/tecnicos').on('value', s => { tecs = s.val() || {}; drawTecs(); draw(); }, erro);
});

// ---------- Técnicos ----------
function fillSel(s, vazio){
  const v = s.value; s.innerHTML = ''; s.appendChild(new Option(vazio, ''));
  Object.entries(tecs).forEach(([k, t]) => s.appendChild(new Option(t.nome, k))); s.value = v;
}
function drawTecs(){
  const L = $('tl'); L.innerHTML = '';
  Object.entries(tecs).forEach(([k, t]) => {
    const r = el('div', '', 'row'); r.style.margin = '4px 0';
    const i = el('span', t.nome + ' · ' + t.email); i.style.flex = '1';
    const b = el('button', 'Remover', 'sec');
    b.onclick = () => { if (confirm('Remover o acesso de ' + t.nome + '?')) fdb.ref('adm/tecnicos/' + k).remove(); };
    r.append(i, b); L.appendChild(r);
  });
  fillSel($('mt'), '— sem técnico —'); fillSel($('bt'), '— sem técnico —');
}
$('addt').onclick = async () => {
  const nome = $('tn').value.trim(), em = $('te').value.trim().toLowerCase(), sn = $('ts').value;
  const m = $('tm'); m.style.color = '#b00';
  if (!nome || !em || sn.length < 6) { m.textContent = 'Preencha nome, e-mail e senha (mínimo 6 caracteres)'; return; }
  m.style.color = '#555'; m.textContent = 'Cadastrando...';
  try {
    const app2 = firebase.apps.find(a => a.name === 'sec') || firebase.initializeApp(firebaseConfig, 'sec');
    let jaTinha = false;
    try { await app2.auth().createUserWithEmailAndPassword(em, sn); }
    catch (e) { if (e && e.code === 'auth/email-already-in-use') jaTinha = true; else throw e; }
    await app2.auth().signOut();
    await fdb.ref('adm/tecnicos/' + em.replace(/\./g, ',')).set({ nome, email: em });
    m.style.color = '#16a34a';
    m.textContent = jaTinha ? 'Acesso liberado. O e-mail já existia, então a senha antiga continua valendo.' : 'Técnico cadastrado.';
    $('tn').value = $('te').value = $('ts').value = '';
  } catch (e) { m.style.color = '#b00'; m.textContent = 'Erro ao cadastrar (' + ((e && e.code) || 'desconhecido') + ')'; }
};

// ---------- Importar Excel ----------
$('xf').onchange = async () => {
  const f = $('xf').files[0], m = $('xm'); if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }).filter(r => r.some(c => c !== ''));
    rotaNome = f.name.replace(/\.[^.]+$/, '');
    const h = (linhas[0] || []).map((x, i) => String(x).trim() || 'Coluna ' + (i + 1));
    const fill = (id, re, opc) => {
      const s = $(id); s.innerHTML = ''; if (opc) s.appendChild(new Option('— nenhum —', ''));
      h.forEach((x, i) => s.appendChild(new Option(x, i)));
      const k = h.findIndex(x => re.test(x)); s.value = k >= 0 ? k : (opc ? '' : 0);
    };
    fill('mc', /poste|n[úu]mero|^n[ºo°]|c[óo]d|^id$|nome/i);
    fill('ml', /^lat|coord|posi[çc]/i);
    fill('mo', /^lon|^lng|^long|coord|posi[çc]/i);
    fill('mi', /obs|info|rua|endere|descri/i, true);
    $('map2').style.display = ''; m.style.color = '#555';
    m.textContent = (linhas.length - 1) + ' linha(s) em "' + rotaNome + '". Confira as colunas e clique em Importar.';
  } catch (e) { m.style.color = '#b00'; m.textContent = 'Não consegui ler a planilha'; }
};
const filaItem = p => ({ id: p.id, n: p.n, code: p.code, lat: p.lat, lng: p.lng, info: p.info || '', rota: p.rota || '' });
$('imp').onclick = async () => {
  const m = $('xm'), ci = +$('mc').value, la = +$('ml').value, lo = +$('mo').value;
  const ii = $('mi').value === '' ? -1 : +$('mi').value, tk = $('mt').value, t = tk ? tecs[tk] : null;
  const num = v => parseFloat(String(v).replace(',', '.'));
  const up = {}, stamp = Date.now(); let n = 0, bad = 0;
  linhas.slice(1).forEach(r => {
    let lat, lng;
    if (la === lo) { const k = String(r[la]).match(/-?\d+(?:[.,]\d+)?/g); if (k && k.length >= 2) { lat = num(k[0]); lng = num(k[1]); } }
    else { lat = num(r[la]); lng = num(r[lo]); }
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) { bad++; return; }
    n++;
    const id = stamp + '_' + n + Math.random().toString(36).slice(2, 5);
    const p = { id, n, code: String(r[ci] ?? '').trim() || '---', lat, lng, info: ii >= 0 ? String(r[ii] ?? '').trim().slice(0, 200) : '',
      rota: rotaNome, tec: t ? t.email : '', tecNome: t ? t.nome : '', criado: new Date().toISOString() };
    up['adm/postes/' + id] = p;
    if (t) up['adm/fila/' + tk + '/' + id] = filaItem(p);
  });
  if (!n) { m.style.color = '#b00'; m.textContent = 'Nenhuma linha com coordenada válida. Confira as colunas.'; return; }
  try {
    await fdb.ref().update(up);
    m.style.color = '#16a34a';
    m.textContent = n + ' poste(s) importado(s)' + (t ? ' e atribuído(s) a ' + t.nome : ' sem técnico') + (bad ? ' · ' + bad + ' linha(s) ignorada(s)' : '');
    $('map2').style.display = 'none'; $('xf').value = '';
  } catch (e) { m.style.color = '#b00'; m.textContent = 'Erro ao importar (confira as regras)'; }
};

// ---------- Ações ----------
function atribuir(ids, tk){
  const t = tk ? tecs[tk] : null, up = {};
  ids.forEach(id => {
    const x = byId[id]; if (!x) return;
    if (x.tecKey) up['adm/fila/' + x.tecKey + '/' + id] = null;
    up['adm/postes/' + id + '/tec'] = t ? t.email : '';
    up['adm/postes/' + id + '/tecNome'] = t ? t.nome : '';
    if (t && !x.concl) up['adm/fila/' + tk + '/' + id] = filaItem(x);
  });
  return fdb.ref().update(up);
}
function concluir(ids, reabrir){
  const up = {}, now = new Date().toISOString();
  ids.forEach(id => {
    const x = byId[id]; if (!x) return;
    up['adm/concluidos/' + id] = reabrir ? null : now;
    if (x.tecKey) up['adm/fila/' + x.tecKey + '/' + id] = reabrir ? filaItem(x) : null;
  });
  return fdb.ref().update(up);
}
function excluir(ids){
  const up = {};
  ids.forEach(id => {
    const x = byId[id]; if (!x) return;
    up['adm/postes/' + id] = null; up['adm/concluidos/' + id] = null;
    if (x.tecKey) up['adm/fila/' + x.tecKey + '/' + id] = null;
  });
  return fdb.ref().update(up);
}
const marcados = () => [...sel].filter(id => byId[id]);
$('bat').onclick = async () => {
  const a = marcados(); if (!a.length) return say('Marque os postes primeiro', '#b00');
  await atribuir(a, $('bt').value); sel.clear(); say(a.length + ' poste(s) atribuído(s)', '#16a34a');
};
$('bco').onclick = async () => {
  const a = marcados(); if (!a.length) return say('Marque os postes primeiro', '#b00');
  await concluir(a); sel.clear(); say(a.length + ' poste(s) concluído(s)', '#16a34a');
};
$('bex').onclick = async () => {
  const a = marcados(); if (!a.length) return say('Marque os postes primeiro', '#b00');
  if (!confirm('Excluir ' + a.length + ' poste(s) da rota? As fotos já enviadas continuam no banco.')) return;
  await excluir(a); sel.clear(); say(a.length + ' poste(s) excluído(s)', '#16a34a');
};

// ---------- Lista ----------
function grupos(){
  byId = {};
  Object.entries(po).forEach(([id, o]) => { byId[id] = { ...o, id, fotos: [], tecKey: o.tec ? o.tec.replace(/\./g, ',') : '' }; });
  Object.entries(meta).forEach(([k, m]) => { const x = byId[m.pid]; if (x) x.fotos.push({ k, ...m }); });
  const arr = Object.values(byId);
  arr.forEach(x => {
    x.fotos.sort((a, b) => a.time < b.time ? -1 : 1);
    x.concl = cc[x.id];
    x.estado = x.concl ? 'gray' : x.fotos.length ? 'green' : 'red';
  });
  const nm = x => x.tecNome || '~';
  return arr.sort((a, b) => nm(a).localeCompare(nm(b)) || String(a.rota).localeCompare(String(b.rota)) || (a.n || 0) - (b.n || 0));
}
const nome = (x, i) => 'POSTE-' + String(x.code).replace(/[^\w-]+/g, '_') + '_' + (i + 1) + '.jpg';

function draw(){
  const q = $('q').value.toLowerCase(), fe = $('fe').value;
  const gs = grupos().filter(x => (!fe || x.estado === fe) && [x.code, x.rua, x.tecNome, x.rota, x.info].join(' ').toLowerCase().includes(q));
  vis = gs;
  const c = k => gs.filter(x => x.estado === k).length;
  say(gs.length + ' poste(s) · 🔴 ' + c('red') + ' · 🟢 ' + c('green') + ' · ⚪ ' + c('gray'));
  const L = $('list'); L.innerHTML = ''; let last = null;
  gs.forEach(x => {
    const tn = x.tecNome || 'Sem técnico atribuído';
    if (tn !== last) {
      last = tn; const t = gs.filter(y => (y.tecNome || 'Sem técnico atribuído') === tn);
      L.appendChild(el('h3', '👷 ' + tn + ' · ' + t.length + ' poste(s) · ' + t.filter(y => y.estado === 'green').length + ' com foto'));
    }
    const card = el('div', '', 'card pole ' + x.estado), r = el('div', '', 'row');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = sel.has(x.id);
    cb.onchange = () => { cb.checked ? sel.add(x.id) : sel.delete(x.id); };
    const as = document.createElement('select'); as.appendChild(new Option('— sem técnico —', ''));
    Object.entries(tecs).forEach(([k, t]) => as.appendChild(new Option(t.nome, k))); as.value = x.tecKey;
    as.onchange = () => atribuir([x.id], as.value);
    const info = el('span', [x.rota, x.info, x.fotos.length + ' foto(s)'].filter(Boolean).join(' · '));
    info.style.flex = '1'; info.style.fontSize = '13px';
    const v = el('button', open.has(x.id) ? 'Ocultar' : 'Ver fotos', 'sec');
    v.onclick = () => { open.has(x.id) ? open.delete(x.id) : open.add(x.id); draw(); };
    const d = el('button', '⬇', 'sec'); d.title = 'Baixar fotos deste poste'; d.onclick = () => baixar([x], 0);
    const k = el('button', x.concl ? 'Reabrir' : '✔ Concluir', x.concl ? 'sec' : '');
    k.onclick = () => concluir([x.id], !!x.concl);
    r.append(cb, el('b', 'Poste ' + x.code), el('span', TXT[x.estado], 'tag ' + x.estado), as, info, v, d, k);
    card.appendChild(r);
    if (open.has(x.id)) { const th = el('div', '', 'th'); card.appendChild(th); thumbs(x, th); }
    L.appendChild(card);
  });
}
$('q').oninput = draw; $('fe').onchange = draw;
$('all').onclick = () => { const todos = vis.every(x => sel.has(x.id)); vis.forEach(x => todos ? sel.delete(x.id) : sel.add(x.id)); draw(); };

function thumbs(x, box){
  x.fotos.forEach((f, i) => {
    const fig = el('div'), a = el('a'), im = el('img'); a.appendChild(im); a.download = nome(x, i);
    const g = f.gps, cap = el('div', g ? 'GPS ' + g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + ' (±' + g.acc + ' m)' : 'sem GPS');
    cap.style.cssText = 'font-size:11px;color:#555';
    fig.append(a, cap); box.appendChild(fig);
    fdb.ref('adm/fotos_data/' + f.k + '/img').once('value').then(s => { im.src = a.href = s.val(); });
  });
}

// ---------- Download ----------
function salvar(blob, nm){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nm;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function baixar(gs, size){
  gs = gs.filter(x => x.fotos.length);
  if (!gs.length) { say('Nada para baixar (nenhum poste marcado tem foto)', '#b00'); return; }
  const n = size || gs.length, lotes = [];
  for (let i = 0; i < gs.length; i += n) lotes.push(gs.slice(i, i + n));
  try {
    for (let li = 0; li < lotes.length; li++) {
      const zip = new JSZip();
      let csv = 'arquivo;poste;tecnico;rota;rua;lat_poste;lng_poste;lat_gps_tecnico;lng_gps_tecnico;precisao_m;data_hora\n';
      for (const x of lotes[li]) {
        for (const [i, f] of x.fotos.entries()) {
          say('Baixando ' + (lotes.length > 1 ? 'ZIP ' + (li + 1) + '/' + lotes.length + ' · ' : '') + 'poste ' + x.code + '...');
          const img = (await fdb.ref('adm/fotos_data/' + f.k + '/img').once('value')).val();
          if (!img) continue;
          const nm = nome(x, i), g = f.gps || {};
          zip.file(nm, img.split(',')[1], { base64: true });
          csv += [nm, x.code, x.tecNome, x.rota, (f.rua || '').replace(/;/g, ','), x.lat, x.lng, g.lat ?? '', g.lng ?? '', g.acc ?? '',
            new Date(f.time).toLocaleString('pt-BR')].join(';') + '\n';
        }
      }
      zip.file('fotos.csv', '\ufeff' + csv);
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const base = gs.length === 1 ? 'POSTE-' + String(gs[0].code).replace(/[^\w-]+/g, '_')
        : 'postes' + (lotes.length > 1 ? '-parte' + (li + 1) + 'de' + lotes.length : '-todos');
      salvar(blob, base + '.zip');
      await new Promise(r => setTimeout(r, 700));
    }
    say('Download concluído. Agora marque os postes e clique em Concluir.', '#16a34a');
  } catch (e) { say('Erro ao baixar', '#b00'); }
}
$('dl').onclick = () => {
  const gs = grupos().filter(x => x.estado !== 'red');
  baixar(sel.size ? gs.filter(x => sel.has(x.id)) : gs, +$('lote').value);
};
</script>
</body>
</html>
