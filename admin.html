<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Rotas e Mapas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0;z-index:1}
  #map.selecting{cursor:crosshair}
  #panel{position:absolute;z-index:1000;left:10px;top:10px;background:#fff;
    border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.3);padding:14px;
    width:360px;max-height:90vh;overflow-y:auto;box-sizing:border-box}
  #login{position:absolute;inset:0;background:#f3f4f6;z-index:2000;display:flex;align-items:center;justify-content:center}
  .login-card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);width:100%;max-width:340px}
  input,select,button{font-size:14px;padding:8px;border-radius:6px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin-top:4px}
  button{background:#1d6fe8;color:#fff;border:0;cursor:pointer;font-weight:600}
  button.sec{background:#e5e7eb;color:#111}
  button.green{background:#16a34a}
  button.warn{background:#f59e0b;color:#fff}
  button.danger{background:#dc2626;color:#fff}
  label{font-size:12px;font-weight:bold;color:#444;display:block;margin-top:8px}
  .row{display:flex;gap:6px;margin-top:6px}
  
  .pin{color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .1s}
  .pin-red{background:#dc2626}
  .pin-yellow{background:#facc15;color:#111}
  .pin-green{background:#16a34a}
  .pin.selected{border:3px solid #facc15;box-shadow:0 0 0 3px #1d6fe8;transform:scale(1.25);z-index:999!important}
  
  .box-sel{background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:10px;margin-top:10px}
  .box-danger{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-top:10px}
  .box-report{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin-top:10px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h3 style="margin-top:0;color:#1d6fe8">Login Admin</h3>
    <input id="em" type="email" placeholder="E-mail do administrador">
    <input id="pw" type="password" placeholder="Senha">
    <button id="go">Entrar</button>
    <p id="err" style="color:#b00;font-size:13px;text-align:center"></p>
  </div>
</div>

<div id="map"></div>

<div id="panel" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="margin:0;color:#1d6fe8">Painel Admin</h3>
    <button class="sec" id="out" style="width:auto;padding:4px 8px;font-size:12px">Sair</button>
  </div>

  <div class="box-sel">
    <button id="btnSelectMode">🖱️ Selecionar Área no Mapa</button>
    <div id="selActions" style="display:none;margin-top:8px">
      <div style="font-size:13px;font-weight:bold;color:#1e3a8a" id="selCount">0 poste(s) selecionado(s)</div>
      <label>Enviar selecionados para:</label>
      <select id="selTech"></select>
      <div class="row">
        <button class="green" id="btnAssignSel">✔ Atribuir</button>
        <button class="sec" id="btnClearSel">Limpar</button>
      </div>
    </div>
  </div>

  <details style="margin-top:10px">
    <summary style="cursor:pointer"><b>👷 Cadastrar Técnico</b></summary>
    <input id="tn" placeholder="Nome do Técnico">
    <input id="te" type="email" placeholder="E-mail">
    <input id="ts" type="password" placeholder="Senha (mín. 6)">
    <button id="addt" style="margin-top:6px">Cadastrar</button>
    <p id="tm" style="font-size:12px;margin:4px 0"></p>
    <div id="tl" style="font-size:13px;max-height:100px;overflow-y:auto"></div>
  </details>

  <details style="margin-top:8px">
    <summary style="cursor:pointer"><b>📥 Importar Planilha (Excel)</b></summary>
    <input type="file" id="xf" accept=".xlsx, .xls" style="margin-top:6px">
    <div id="map2" style="display:none">
      <label>Coluna do Poste (Local) <select id="mc"></select></label>
      <label>Coluna de Coordenadas (Localização) <select id="mo"></select></label>
      <label>Atribuir a (opcional) <select id="mt"></select></label>
      <button id="imp" style="margin-top:6px">Importar e Marcar no Mapa</button>
    </div>
    <p id="xm" style="font-size:12px;margin:4px 0"></p>
  </details>

  <hr style="margin:12px 0;border:0;border-top:1px solid #eee">
  
  <!-- BARRINHA DE PESQUISA DE POSTES -->
  <label style="color:#1d6fe8">🔍 Pesquisar Poste no Mapa</label>
  <div class="row">
    <input type="text" id="txtBuscaAdmin" placeholder="Ex: 1456 ou Poste 1441" style="margin-top:0">
    <button id="btnBuscarAdmin" style="width:auto;padding:8px 14px;margin-top:0">Buscar</button>
  </div>

  <label style="margin-top:10px">Filtrar Status no Mapa</label>
  <select id="fe">
    <option value="">Todos os Status</option>
    <option value="unassigned">🔴 Sem técnico atribuído</option>
    <option value="yellow">🟡 Atribuídos (aguardando foto)</option>
    <option value="green">🟢 Executados (com foto)</option>
  </select>

  <!-- RODAPÉ DE RELATÓRIOS -->
  <div class="box-report">
    <label style="color:#166534">📊 Relatórios</label>
    <label style="color:#166534">📅 Dia</label>
    <input type="date" id="rDia">
    <div class="row">
      <div style="flex:1"><label style="color:#166534">De</label><input type="date" id="rDe"></div>
      <div style="flex:1"><label style="color:#166534">Até</label><input type="date" id="rAte"></div>
    </div>
    <label style="color:#166534">👷 Técnico</label>
    <select id="rTec"></select>
    <p style="font-size:11px;color:#555;margin:4px 0">Só “Dia” = um dia. “De/Até” = período. Em branco = todo o histórico.</p>
    <button class="green" id="btnRelatorioOk" style="margin-top:6px">📄 Baixar relatório (CSV)</button>
    <button class="green" id="btnPdf" style="margin-top:6px">🖨️ Imprimir / PDF</button>
  </div>

  <div class="box-danger">
    <label style="color:#991b1b">⚠️ Zona de Perigo</label>
    <button class="danger" id="btnZerar" style="margin-top:6px">🗑️ Zerar Mapa / Excluir Zona</button>
  </div>

  <p id="st" style="font-size:12px;color:#555;margin:6px 0 0"></p>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const fdb = firebase.database(), au = firebase.auth();
const $ = id => document.getElementById(id);

let po = {}, meta = {}, tecs = {}, concluidosLog = {}, markers = {};
let selectedIds = new Set();
let selectMode = false;

const map = L.map('map', { zoomControl: false }).setView([-14.2, -51.9], 4);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

$('go').onclick = () => au.signInWithEmailAndPassword($('em').value.trim(), $('pw').value)
  .catch(e => { $('err').textContent = 'Erro ao entrar: ' + e.message; });
$('out').onclick = () => au.signOut().then(() => location.reload());

au.onAuthStateChanged(u => {
  $('login').style.display = u ? 'none' : 'flex';
  $('panel').style.display = u ? 'block' : 'none';
  if (!u) return;
  
  fdb.ref('adm/postes').on('value', s => { po = s.val() || {}; atualizarMapa(); });
  fdb.ref('adm/fotos_meta').on('value', s => { meta = s.val() || {}; atualizarMapa(); });
  fdb.ref('adm/concluidos_log').on('value', s => { concluidosLog = s.val() || {}; });
  fdb.ref('adm/tecnicos').on('value', s => { tecs = s.val() || {}; carregarSelectsTecnicos(); atualizarMapa(); });
});

function carregarSelectsTecnicos() {
  const fill = (el, textoPadrao) => {
    const valAtual = el.value;
    el.innerHTML = `<option value="">${textoPadrao}</option>`;
    Object.entries(tecs).forEach(([k, t]) => el.appendChild(new Option(`${t.nome} (${t.email})`, k)));
    el.value = valAtual;
  };
  fill($('mt'), '— deixar sem técnico por enquanto —');
  fill($('selTech'), '— remover técnico (deixar livre) —');
  const rt = $('rTec'), vr = rt.value;
  rt.innerHTML = '<option value="">Todos os técnicos</option>';
  Object.values(tecs).forEach(t => rt.appendChild(new Option(t.nome + ' (' + t.email + ')', t.email)));
  rt.value = vr;
  
  const tl = $('tl'); tl.innerHTML = '';
  Object.entries(tecs).forEach(([k, t]) => {
    tl.innerHTML += `<div style="padding:2px 0;border-bottom:1px solid #eee">${t.nome} · <small>${t.email}</small></div>`;
  });
}

// ===== Pesquisa de Poste no Admin =====
$('btnBuscarAdmin').onclick = () => {
  const termo = $('txtBuscaAdmin').value.trim().toLowerCase();
  if (!termo) {
    alert('Digite o código ou número do poste para buscar.');
    return;
  }

  let encontradoId = null;
  let encontradoObj = null;

  for (const [id, p] of Object.entries(po)) {
    const codeStr = String(p.code || '').toLowerCase();
    const numStr = String(p.n || '').toLowerCase();
    if (codeStr.includes(termo) || numStr.includes(termo)) {
      encontradoId = id;
      encontradoObj = p;
      break;
    }
  }

  if (encontradoObj && markers[encontradoId]) {
    map.setView([encontradoObj.lat, encontradoObj.lng], 18);
    markers[encontradoId].openPopup();
    $('st').textContent = `Poste ${encontradoObj.code} localizado no mapa!`;
  } else {
    alert('Poste não encontrado na base de dados ativa.');
  }
};

// ===== Relatórios: histórico de postes executados, com filtro de dia/período =====
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = d => d ? d.toLocaleString('pt-BR') : '';
function parseBR(s) {
  const m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4})\D+(\d{2}):(\d{2})(?::(\d{2}))?/);
  return m ? new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0)) : null;
}
function filtroTexto() {
  const dia = $('rDia').value, de = $('rDe').value, ate = $('rAte').value, t = $('rTec');
  const br = v => v.split('-').reverse().join('/');
  let x = dia ? 'Dia ' + br(dia) : (de || ate) ? 'Período ' + (de ? br(de) : 'do início') + ' a ' + (ate ? br(ate) : 'hoje') : 'Todo o histórico';
  if (t.value) x += ' · Técnico: ' + t.options[t.selectedIndex].text;
  return x;
}
async function registrosRelatorio() {
  const metas = (await fdb.ref('adm/fotos_meta').once('value')).val() || {};
  const lista = [];
  Object.values(concluidosLog).forEach(l => lista.push({
    code: l.code, tec: l.tec || '', nome: l.tecNome || '', rua: l.rua || '',
    exec: l.execTime ? new Date(l.execTime) : parseBR(l.dataHora),
    baixado: l.baixadoEm ? new Date(l.baixadoEm) : parseBR(l.dataHora), status: 'Baixado / concluído'
  }));
  const vistos = new Set();
  Object.values(metas).sort((x, y) => String(x.time).localeCompare(String(y.time))).forEach(m => {
    if (vistos.has(m.pid)) return; vistos.add(m.pid);
    lista.push({ code: m.code, tec: m.tec || '', nome: m.tecNome || '', rua: m.rua || '',
      exec: m.time ? new Date(m.time) : null, baixado: null, status: 'Foto recebida (não baixada)' });
  });
  const dia = $('rDia').value, de = $('rDe').value, ate = $('rAte').value, tec = $('rTec').value;
  const ini = dia ? new Date(dia + 'T00:00:00') : de ? new Date(de + 'T00:00:00') : null;
  const fim = dia ? new Date(dia + 'T23:59:59.999') : ate ? new Date(ate + 'T23:59:59.999') : null;
  return lista
    .filter(r => (!tec || r.tec === tec) && (!ini || (r.exec && r.exec >= ini)) && (!fim || (r.exec && r.exec <= fim)))
    .sort((x, y) => (x.exec || 0) - (y.exec || 0));
}

$('btnRelatorioOk').onclick = async () => {
  const regs = await registrosRelatorio();
  if (!regs.length) { alert('Nenhum registro no filtro escolhido.'); return; }
  let csv = '\uFEFFNumero_Poste;Login_Tecnico;Nome_Tecnico;Rua;Data_Hora_Execucao;Data_Hora_Download;Situacao\n';
  regs.forEach(r => {
    csv += [r.code, r.tec, r.nome, r.rua, fmt(r.exec), fmt(r.baixado), r.status]
      .map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';') + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'Relatorio_Postes_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
};

$('btnPdf').onclick = async () => {
  const w = window.open('', '_blank');
  const regs = await registrosRelatorio();
  if (!regs.length) { if (w) w.close(); alert('Nenhum registro no filtro escolhido.'); return; }
  if (!w) { alert('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.'); return; }
  const porTec = {};
  regs.forEach(r => { const k = r.tec || 'Não identificado'; porTec[k] = (porTec[k] || 0) + 1; });
  const resumo = Object.entries(porTec).map(([k, n]) => esc(k) + ': <b>' + n + '</b>').join(' &nbsp;·&nbsp; ');
  let h = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório de Postes Executados</title>
<style>
  body{font-family:Arial,sans-serif;margin:20px;color:#111}
  h2{text-align:center;color:#1d6fe8;margin:0 0 4px}
  p.sub{text-align:center;font-size:13px;color:#555;margin:2px 0}
  p.res{font-size:13px;margin:12px 0}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{border:1px solid #ddd;padding:7px;font-size:12px;text-align:left}
  th{background:#f3f4f6} tr:nth-child(even){background:#f9fafb}
  .footer{margin-top:20px;text-align:right;font-size:11px;color:#777}
</style></head><body>
<h2>Relatório de Postes Executados</h2>
<p class="sub"><b>${esc(filtroTexto())}</b></p>
<p class="sub">Gerado em ${esc(new Date().toLocaleString('pt-BR'))} por ${esc((au.currentUser && au.currentUser.email) || '')}</p>
<p class="res">Total: <b>${regs.length}</b> poste(s) &nbsp;|&nbsp; ${resumo}</p>
<table><thead><tr><th>Nº do poste</th><th>Login do técnico</th><th>Rua</th><th>Data e hora da execução</th><th>Situação</th></tr></thead><tbody>`;
  regs.forEach(r => {
    h += `<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.tec || 'Não identificado')}${r.nome ? '<br><small>' + esc(r.nome) + '</small>' : ''}</td>
<td>${esc(r.rua || 'Localização via GPS')}</td><td>${esc(fmt(r.exec) || 'Data não informada')}</td><td>${esc(r.status)}</td></tr>`;
  });
  h += `</tbody></table><div class="footer">Sistema de Gestão de Rotas e Fotos · ${regs.length} registro(s)</div>
<script>window.onload = function() { window.print(); }<\/script></body></html>`;
  w.document.write(h);
  w.document.close();
};

// Botão Zerar Banco com Senha
$('btnZerar').onclick = async () => {
  const senhaDigitada = prompt("⚠️ ATENÇÃO: Isso vai apagar TODOS os postes, fotos e histórico de relatórios da base de dados.\n\nPara confirmar, digite a sua senha de Administrador:");
  if (!senhaDigitada) return;

  const user = au.currentUser;
  try {
    const credential = firebase.auth.EmailAuthProvider.credential(user.email, senhaDigitada);
    await user.reauthenticateWithCredential(credential);

    await fdb.ref().update({
      'adm/postes': null,
      'adm/fila': null,
      'adm/fotos_meta': null,
      'adm/fotos_data': null,
      'adm/concluidos_log': null
    });
    
    selectedIds.clear();
    atualizarUI_Selecao();
    alert('Mapa e relatórios zerados com sucesso.');
  } catch (err) {
    alert('Senha incorreta ou erro!');
  }
};

// Seleção por Retângulo
let startLatLng = null, selectionRect = null;
$('btnSelectMode').onclick = () => {
  selectMode = !selectMode;
  const btn = $('btnSelectMode');
  if (selectMode) {
    btn.textContent = '❌ Sair do Modo Seleção'; btn.className = 'warn';
    $('map').classList.add('selecting'); map.dragging.disable();
  } else {
    btn.textContent = '🖱️ Selecionar Área no Mapa'; btn.className = '';
    $('map').classList.remove('selecting'); map.dragging.enable();
  }
};

map.on('mousedown', (e) => {
  if (!selectMode) return;
  startLatLng = e.latlng;
  if (selectionRect) map.removeLayer(selectionRect);
  selectionRect = L.rectangle([startLatLng, startLatLng], { color: '#1d6fe8', weight: 2, fillColor: '#3b82f6', fillOpacity: 0.2 }).addTo(map);
});

map.on('mousemove', (e) => {
  if (!selectMode || !startLatLng || !selectionRect) return;
  selectionRect.setBounds([startLatLng, e.latlng]);
});

map.on('mouseup', (e) => {
  if (!selectMode || !startLatLng || !selectionRect) return;
  const bounds = L.latLngBounds(startLatLng, e.latlng);
  Object.entries(po).forEach(([id, p]) => {
    if (markers[id] && bounds.contains([p.lat, p.lng])) selectedIds.add(id);
  });
  map.removeLayer(selectionRect); selectionRect = null; startLatLng = null;
  atualizarUI_Selecao(); atualizarMapa();
});

function atualizarUI_Selecao() {
  const box = $('selActions');
  if (selectedIds.size > 0) {
    box.style.display = 'block';
    $('selCount').textContent = `${selectedIds.size} poste(s) selecionado(s)`;
  } else { box.style.display = 'none'; }
}

$('btnClearSel').onclick = () => { selectedIds.clear(); atualizarUI_Selecao(); atualizarMapa(); };

async function atribuirPostes(idsArray, tecKey) {
  const t = tecKey ? tecs[tecKey] : null;
  const up = {};
  idsArray.forEach(id => {
    const p = po[id]; if (!p) return;
    if (p.tec) up[`adm/fila/${p.tec.replace(/\./g, ',')}/${id}`] = null;
    up[`adm/postes/${id}/tec`] = t ? t.email : '';
    up[`adm/postes/${id}/tecNome`] = t ? t.nome : '';
    if (t) up[`adm/fila/${tecKey}/${id}`] = { id: p.id, n: p.n, code: p.code, lat: p.lat, lng: p.lng };
  });
  await fdb.ref().update(up);
}

$('btnAssignSel').onclick = async () => {
  if (selectedIds.size === 0) return;
  await atribuirPostes([...selectedIds], $('selTech').value);
  selectedIds.clear(); atualizarUI_Selecao();
  if (selectMode) $('btnSelectMode').click();
};

// Renderização dos Pins
function atualizarMapa() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const filtro = $('fe').value;
  let coords = [];

  Object.entries(po).forEach(([id, p]) => {
    const fotoEntry = Object.entries(meta).find(([k, m]) => m.pid === id);
    const temFoto = !!fotoEntry;
    let estado = temFoto ? 'green' : (p.tec ? 'yellow' : 'red');

    if (filtro === 'unassigned' && p.tec) return;
    if (filtro && filtro !== 'unassigned' && estado !== filtro) return;

    const isSelected = selectedIds.has(id);
    let pinClass = `pin pin-${estado}` + (isSelected ? ' selected' : '');
    
    const icon = L.divIcon({ className: '', html: `<div class="${pinClass}">${p.n || '📍'}</div>`, iconSize: [26,26], iconAnchor: [13,13] });
    const m = L.marker([p.lat, p.lng], { icon }).addTo(map);

    const tip = document.createElement('div');
    const t1 = document.createElement('b'); t1.textContent = 'Poste ' + p.code;
    const t2 = document.createElement('div'); t2.textContent = p.tecNome ? '👷 ' + p.tecNome : '⚠️ Sem técnico atribuído';
    tip.append(t1, t2);
    if (p.tec) { const t3 = document.createElement('small'); t3.textContent = p.tec; tip.appendChild(t3); }
    if (temFoto) { const t4 = document.createElement('div'); t4.textContent = '🟢 Foto recebida'; tip.appendChild(t4); }
    m.bindTooltip(tip, { direction: 'top', offset: [0, -12] });
    
    m.on('click', (e) => {
      if (selectMode) {
        L.DomEvent.stopPropagation(e);
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        atualizarUI_Selecao(); atualizarMapa();
      }
    });

    const popDiv = document.createElement('div');
    popDiv.style.minWidth = '200px';
    popDiv.innerHTML = `<b>Poste: ${p.code}</b><br><small>Técnico: ${p.tecNome || 'Nenhum'}</small><br>`;

    if (temFoto) {
      const [fotoKey, fotoMeta] = fotoEntry;
      popDiv.innerHTML += `<div style="margin-top:4px;color:#16a34a;font-weight:bold">🟢 Foto Recebida!</div>`;
      popDiv.innerHTML += `<small>📍 Rua: ${fotoMeta.rua || 'Não informada'}</small><br>`;
      
      const imgThumb = document.createElement('img');
      imgThumb.style.cssText = 'width:100%;height:120px;object-fit:cover;border-radius:4px;margin-top:6px;background:#eee';
      popDiv.appendChild(imgThumb);

      fdb.ref('adm/fotos_data/' + fotoKey + '/img').once('value').then(s => {
        if (s.val()) imgThumb.src = s.val();
      });

      const btnBaixarEApagar = document.createElement('button');
      btnBaixarEApagar.textContent = '📥 Baixar Foto e Concluir';
      btnBaixarEApagar.style.cssText = 'background:#16a34a;margin-top:8px;padding:6px';
      btnBaixarEApagar.onclick = async () => {
        const imgData = (await fdb.ref('adm/fotos_data/' + fotoKey + '/img').once('value')).val();
        if (!imgData) { alert('Erro ao buscar foto.'); return; }

        const a = document.createElement('a');
        a.href = imgData;
        a.download = `POSTE-${p.code}.jpg`;
        document.body.appendChild(a); a.click(); a.remove();

        const dataHoraAtual = new Date().toLocaleString('pt-BR');
        const logId = 'log_' + Date.now() + '_' + Math.floor(Math.random()*1000);

        const updates = {};
        updates[`adm/concluidos_log/${logId}`] = {
          code: p.code, dataHora: dataHoraAtual, baixadoEm: new Date().toISOString(),
          baixadoPor: (au.currentUser && au.currentUser.email) || '',
          execTime: fotoMeta.time || '', tec: fotoMeta.tec || p.tec || '', tecNome: fotoMeta.tecNome || p.tecNome || '',
          rua: fotoMeta.rua || '', rota: p.rota || '', lat: p.lat, lng: p.lng
        };
        updates[`adm/postes/${id}`] = null;
        updates[`adm/fotos_meta/${fotoKey}`] = null;
        updates[`adm/fotos_data/${fotoKey}`] = null;
        if (p.tec) updates[`adm/fila/${p.tec.replace(/\./g, ',')}/${id}`] = null;

        await fdb.ref().update(updates);
        map.closePopup();
      };
      popDiv.appendChild(btnBaixarEApagar);

    } else {
      const selInd = document.createElement('select');
      selInd.style.marginTop = '6px';
      selInd.innerHTML = '<option value="">— sem técnico —</option>';
      Object.entries(tecs).forEach(([k, t]) => {
        const opt = new Option(t.nome, k);
        if (p.tec === t.email) opt.selected = true;
        selInd.appendChild(opt);
      });
      
      const btnSalvarInd = document.createElement('button');
      btnSalvarInd.textContent = 'Salvar Técnico';
      btnSalvarInd.style.marginTop = '6px';
      btnSalvarInd.style.padding = '5px';
      btnSalvarInd.onclick = async () => {
        await atribuirPostes([id], selInd.value);
        map.closePopup();
      };
      popDiv.appendChild(selInd);
      popDiv.appendChild(btnSalvarInd);
    }

    m.bindPopup(popDiv);
    markers[id] = m;
    coords.push([p.lat, p.lng]);
  });

  if (coords.length > 0 && !window.fitInitial) {
    map.fitBounds(coords, { padding: [50, 50], maxZoom: 16 });
    window.fitInitial = true;
  }
}

$('fe').onchange = atualizarMapa;

// Cadastro de Técnico
$('addt').onclick = async () => {
  const nome = $('tn').value.trim(), em = $('te').value.trim().toLowerCase(), sn = $('ts').value;
  if (!nome || !em || sn.length < 6) { $('tm').textContent = 'Preencha dados válidos'; return; }
  try {
    const app2 = firebase.apps.find(a => a.name === 'sec') || firebase.initializeApp(firebaseConfig, 'sec');
    try { await app2.auth().createUserWithEmailAndPassword(em, sn); } catch(e){}
    await app2.auth().signOut();
    await fdb.ref('adm/tecnicos/' + em.replace(/\./g, ',')).set({ nome, email: em });
    $('tm').style.color = '#16a34a'; $('tm').textContent = 'Cadastrado!';
    $('tn').value = $('te').value = $('ts').value = '';
  } catch(e) { $('tm').style.color = '#b00'; $('tm').textContent = 'Erro ao cadastrar.'; }
};

// Importação Excel
$('xf').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
  const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }).filter(r => r.some(c => c !== ''));
  const h = linhas[0] || [];
  
  const fill = (id) => { const s = $(id); s.innerHTML = ''; h.forEach((x, i) => s.appendChild(new Option(x, i))); };
  fill('mc'); fill('mo');
  h.forEach((x, i) => {
    const c = String(x).trim().toLowerCase();
    if (c === 'local') $('mc').value = i;
    if (c === 'localização' || c === 'localizacao') $('mo').value = i;
  });

  $('map2').style.display = 'block';
  window.excelLinhas = linhas.slice(1);
  $('xm').textContent = window.excelLinhas.length + ' linhas encontradas.';
};

$('imp').onclick = async () => {
  const ci = +$('mc').value, loCol = +$('mo').value;
  const tk = $('mt').value, t = tk ? tecs[tk] : null;
  const up = {}, stamp = Date.now(); let n = 0;

  window.excelLinhas.forEach(r => {
    const locStr = String(r[loCol] || '').trim();
    const coordsMatch = locStr.match(/-?\d+(?:[.,]\d+)?/g);
    if (!coordsMatch || coordsMatch.length < 2) return;

    const lat = parseFloat(coordsMatch[0].replace(',', '.'));
    const lng = parseFloat(coordsMatch[1].replace(',', '.'));
    if (isNaN(lat) || isNaN(lng)) return;

    n++;
    const id = stamp + '_' + n;
    const p = { id, n, code: String(r[ci] || '---').trim(), lat, lng, t: t ? t.email : '', tec: t ? t.email : '', tecNome: t ? t.nome : '' };
    up['adm/postes/' + id] = p;
    if (t) up['adm/fila/' + tk + '/' + id] = p;
  });

  await fdb.ref().update(up);
  $('xm').textContent = `${n} postes importados!`;
  $('map2').style.display = 'none';
  window.fitInitial = false;
};
</script>
