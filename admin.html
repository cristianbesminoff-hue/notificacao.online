<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Rotas e Mapas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0;z-index:1}
  #panel{position:absolute;z-index:1000;left:10px;top:10px;background:#fff;
    border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.3);padding:14px;
    width:360px;max-height:85vh;overflow-y:auto;box-sizing:border-box}
  #login{position:absolute;inset:0;background:#f3f4f6;z-index:2000;display:flex;align-items:center;justify-content:center}
  .login-card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);width:100%;max-width:340px}
  input,select,button{font-size:14px;padding:8px;border-radius:6px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin-top:4px}
  button{background:#1d6fe8;color:#fff;border:0;cursor:pointer;font-weight:600}
  button.sec{background:#e5e7eb;color:#111}
  button.green{background:#16a34a}
  label{font-size:12px;font-weight:bold;color:#444;display:block;margin-top:8px}
  .row{display:flex;gap:6px;margin-top:6px}
  .pin-red{background:#dc2626;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .pin-green{background:#16a34a;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .pin-gray{background:#9ca3af;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h3 style="margin-top:0;color:#1d6fe8">Login Admin</h3>
    <input id="em" type="email" placeholder="E-mail do administrador">
    <input id="pw" type="password" placeholder="Senha">
    <button id="go">Entrar</button>
    <p id="err" style="color:#b00;font-size:13px;text-align:center"></p>
  </div>
</div>

<div id="map"></div>

<div id="panel" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="margin:0;color:#1d6fe8">Painel Admin</h3>
    <button class="sec" id="out" style="width:auto;padding:4px 8px;font-size:12px">Sair</button>
  </div>

  <details style="margin-top:10px">
    <summary><b>👷 Cadastrar Técnico</b></summary>
    <input id="tn" placeholder="Nome do Técnico">
    <input id="te" type="email" placeholder="E-mail">
    <input id="ts" type="password" placeholder="Senha (mín. 6)">
    <button id="addt" style="margin-top:6px">Cadastrar</button>
    <p id="tm" style="font-size:12px;margin:4px 0"></p>
    <div id="tl" style="font-size:13px;max-height:100px;overflow-y:auto"></div>
  </details>

  <details style="margin-top:8px">
    <summary><b>📥 Importar Planilha (Excel)</b></summary>
    <input type="file" id="xf" accept=".xlsx, .xls" style="margin-top:6px">
    <div id="map2" style="display:none">
      <label>Nº do poste <select id="mc"></select></label>
      <label>Latitude <select id="ml"></select></label>
      <label>Longitude <select id="mo"></select></label>
      <label>Atribuir a <select id="mt"></select></label>
      <button id="imp" style="margin-top:6px">Importar e Marcar no Mapa</button>
    </div>
    <p id="xm" style="font-size:12px;margin:4px 0"></p>
  </details>

  <hr style="margin:12px 0;border:0;border-top:1px solid #eee">
  
  <label>Gerenciar Pontos</label>
  <div class="row">
    <select id="fe">
      <option value="">Todos os Status</option>
      <option value="red">🔴 Pendentes</option>
      <option value="green">🟢 Executados</option>
      <option value="gray">⚪ Concluídos</option>
    </select>
  </div>
  <button class="green" id="dl" style="margin-top:8px">📦 Baixar Fotos (ZIP)</button>
  
  <p id="st" style="font-size:12px;color:#555;margin:6px 0 0"></p>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const fdb = firebase.database(), au = firebase.auth();
const $ = id => document.getElementById(id);
let po = {}, meta = {}, cc = {}, tecs = {}, markers = {};

const map = L.map('map', { zoomControl: false }).setView([-14.2, -51.9], 4);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

$('go').onclick = () => au.signInWithEmailAndPassword($('em').value.trim(), $('pw').value)
  .catch(e => { $('err').textContent = 'Erro ao entrar: ' + e.message; });
$('out').onclick = () => au.signOut().then(() => location.reload());

au.onAuthStateChanged(u => {
  $('login').style.display = u ? 'none' : 'flex';
  $('panel').style.display = u ? 'block' : 'none';
  if (!u) return;
  
  fdb.ref('adm/postes').on('value', s => { po = s.val() || {}; atualizarMapa(); });
  fdb.ref('adm/fotos_meta').on('value', s => { meta = s.val() || {}; atualizarMapa(); });
  fdb.ref('adm/concluidos').on('value', s => { cc = s.val() || {}; atualizarMapa(); });
  fdb.ref('adm/tecnicos').on('value', s => { tecs = s.val() || {}; carregarSelectsTecnicos(); });
});

function carregarSelectsTecnicos() {
  const mt = $('mt'); mt.innerHTML = '<option value="">— sem técnico —</option>';
  Object.entries(tecs).forEach(([k, t]) => mt.appendChild(new Option(t.nome, k)));
  
  const tl = $('tl'); tl.innerHTML = '';
  Object.entries(tecs).forEach(([k, t]) => {
    tl.innerHTML += `<div>${t.nome} (${t.email})</div>`;
  });
}

// Atualiza os marcadores no mapa do admin em tempo real
function atualizarMapa() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const filtro = $('fe').value;
  let coords = [];

  Object.entries(po).forEach(([id, p]) => {
    const temFoto = Object.values(meta).some(m => m.pid === id);
    const concluido = cc[id];
    let estado = concluido ? 'gray' : (temFoto ? 'green' : 'red');

    if (filtro && estado !== filtro) return;

    let pinClass = estado === 'green' ? 'pin-green' : (estado === 'gray' ? 'pin-gray' : 'pin-red');
    const icon = L.divIcon({ className: '', html: `<div class="${pinClass}">${p.n || '📍'}</div>`, iconSize: [26,26], iconAnchor: [13,13] });
    
    const m = L.marker([p.lat, p.lng], { icon }).addTo(map);
    m.bindPopup(`<b>Poste: ${p.code}</b><br>Técnico: ${p.tecNome || 'Nenhum'}<br>Status: ${estado}`);
    markers[id] = m;
    coords.push([p.lat, p.lng]);
  });

  if (coords.length > 0 && !window.fitInitial) {
    map.fitBounds(coords, { padding: [50, 50], maxZoom: 16 });
    window.fitInitial = true;
  }
}

$('fe').onchange = atualizarMapa;

// Cadastro de Técnico
$('addt').onclick = async () => {
  const nome = $('tn').value.trim(), em = $('te').value.trim().toLowerCase(), sn = $('ts').value;
  const m = $('tm');
  if (!nome || !em || sn.length < 6) { m.textContent = 'Preencha nome, e-mail e senha (mín. 6)'; return; }
  try {
    const app2 = firebase.apps.find(a => a.name === 'sec') || firebase.initializeApp(firebaseConfig, 'sec');
    try { await app2.auth().createUserWithEmailAndPassword(em, sn); } catch(e){}
    await app2.auth().signOut();
    await fdb.ref('adm/tecnicos/' + em.replace(/\./g, ',')).set({ nome, email: em });
    m.style.color = '#16a34a'; m.textContent = 'Técnico cadastrado com sucesso!';
    $('tn').value = $('te').value = $('ts').value = '';
  } catch(e) { m.style.color = '#b00'; m.textContent = 'Erro ao cadastrar.'; }
};

// Importação Excel
$('xf').onchange = async (e) => {
  const f = e.target.files[0], m = $('xm'); if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
  const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }).filter(r => r.some(c => c !== ''));
  const h = linhas[0] || [];
  
  const fill = (id) => { const s = $(id); s.innerHTML = ''; h.forEach((x, i) => s.appendChild(new Option(x, i))); };
  fill('mc'); fill('ml'); fill('mo');
  $('map2').style.display = 'block';
  window.excelLinhas = linhas.slice(1);
  m.textContent = window.excelLinhas.length + ' linhas encontradas na planilha.';
};

$('imp').onclick = async () => {
  const ci = +$('mc').value, la = +$('ml').value, lo = +$('mo').value;
  const tk = $('mt').value, t = tk ? tecs[tk] : null;
  const up = {}, stamp = Date.now(); let n = 0;

  window.excelLinhas.forEach(r => {
    const lat = parseFloat(String(r[la]).replace(',', '.'));
    const lng = parseFloat(String(r[lo]).replace(',', '.'));
    if (isNaN(lat) || isNaN(lng)) return;
    n++;
    const id = stamp + '_' + n;
    const p = { id, n, code: String(r[ci] || '---'), lat, lng, tec: t ? t.email : '', tecNome: t ? t.nome : '' };
    up['adm/postes/' + id] = p;
    if (t) up['adm/fila/' + tk + '/' + id] = p;
  });

  await fdb.ref().update(up);
  $('xm').textContent = n + ' postes importados com sucesso!';
  $('map2').style.display = 'none';
};

// Download ZIP
$('dl').onclick = async () => {
  const zip = new JSZip();
  let count = 0;
  for(const [k, m] of Object.entries(meta)) {
    const imgData = (await fdb.ref('adm/fotos_data/' + k + '/img').once('value')).val();
    if(imgData) {
      zip.file(`poste_${m.code}_${count+1}.jpg`, imgData.split(',')[1], {base64: true});
      count++;
    }
  }
  if(count === 0) { alert('Nenhuma foto encontrada para baixar.'); return; }
  const content = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = 'fotos_postes.zip';
  a.click();
};
</script>
</body>
</html>
